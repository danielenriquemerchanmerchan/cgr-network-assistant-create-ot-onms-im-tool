<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/logo_ico.ico') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css', v=1) }}">
    <title>Contraseña Restablecida</title>
    <style>
        .exito-container {
            position: absolute;
            top: 45%;
            left: 50%;
            margin: -200px 0 0 -180px;
            width: 360px;
            min-height: 350px;
        }
        
        .exito-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .check-icon {
            width: 80px;
            height: 80px;
            background: #58c13d;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: white;
            animation: scaleIn 0.5s ease;
        }
        
        @keyframes scaleIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .exito-box h2 {
            color: white;
            margin-bottom: 15px;
            font-size: 24px;
        }
        
        .exito-box p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .password-info {
            background: rgba(88, 193, 61, 0.2);
            border: 1px solid #58c13d;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        
        .password-info strong {
            color: #58c13d;
            font-size: 14px;
        }
        
        .password-display {
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            letter-spacing: 2px;
        }
        
        .login-button {
            margin-top: 20px;
        }
        
        .login-button a {
            display: inline-block;
            padding: 12px 30px;
            background: #58c13d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        
        .login-button a:hover {
            background: #45a02f;
        }
        
        .email-info {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-top: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="exito-container">
        <img src="{{ url_for('static', filename='img/letras_logo_login.png') }}" alt="Login" style="width: 300px; height: 185px; margin-left: 30px;" />
        
        <div class="exito-box">
            <div class="check-icon">✓</div>
            
            <h2>¡Contraseña Restablecida!</h2>
            
            <p>Tu contraseña ha sido restablecida exitosamente.</p>
            
            <div class="password-info">
                <strong>Tu nueva contraseña es:</strong>
                <div class="password-display">{{ nueva_password }}</div>
            </div>
            
            <p style="color: #ffeb3b; font-size: 12px;">⚠️ Guarda esta contraseña en un lugar seguro</p>
            
            <div class="email-info">
                📧 Hemos enviado un correo de confirmación a tu dirección registrada
            </div>
            
            <div class="login-button">
                <a href="{{ url_for('login') }}">Iniciar Sesión Ahora</a>
            </div>
        </div>
    </div>
    <div id="footer"><span>Jefatura Centro de Gestión © 2024</span></div>
</body>
</html>
